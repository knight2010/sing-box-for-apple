name: Build iOS IPA

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/build-ipa.yml
      - 'SFI/**'
      - 'Shared/**'
      - 'Libbox.xcframework/**'
      - 'sing-box.xcodeproj/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select latest Xcode
        run: |
          ls /Applications | grep Xcode || true
          XCODE_APP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort | tail -n 1 || true)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version
          swift --version

      - name: Build SFI for iOS (unsigned)
        run: |
          xcodebuild -project sing-box.xcodeproj \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "App found at: $APP_PATH"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          rm -rf Payload SFI.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -r SFI.ipa Payload
          ls -lh SFI.ipa
          unzip -l SFI.ipa | head -n 20

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-ipa
          path: SFI.ipa

      - name: Create tag name
        id: tag
        run: |
          TAG="build-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG"

      - name: Create GitHub Release and upload IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: iOS build ${{ steps.tag.outputs.tag }}
          body: |
            Unsigned iOS build of SFI from the dev branch.

            Built with Xcode on macos-26, scheme SFI, Release configuration, with code signing disabled (CODE_SIGNING_ALLOWED=NO). No Apple Developer signing identity was used.

            Install on a device only after signing it with your own Apple Developer account or sideloading tool.
          files: SFI.ipa
          generate_release_notes: true
